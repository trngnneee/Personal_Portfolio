# Render Blueprint — https://render.com/docs/blueprint-spec
# Applied by the owner from the Render dashboard (New → Blueprint). Nothing here is deployed automatically
# from this repo by the agent; see README.md → "Deploy to Render".

# Database: Supabase Postgres (not managed by this Blueprint). See README → "Supabase".

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: portfolio-api
    runtime: node
    # Free: sleeps after ~15 min idle (cold start ~30–60 s), no Shell, ~750 h/month.
    # Switch to `starter` (paid) to keep it awake.
    plan: free
    # Same region as the Supabase project (ap-southeast-1) to keep DB latency low.
    region: singapore
    # --include=dev: NODE_ENV=production would otherwise skip typescript/tsx needed to build (and to seed).
    buildCommand: npm ci --include=dev && npm run build -w shared && npm run build -w backend
    # Runs migrations, ensures section rows, then listens on $PORT.
    startCommand: npm run start -w backend
    healthCheckPath: /healthz
    autoDeploy: true
    # No custom domain (Render free: apex + auto www already use the 2 allowed custom domains).
    # Render URL https://portfolio-api-5hvt.onrender.com (the name was taken, so Render added -5hvt). If it changes, replace this
    # hostname everywhere in this file (VITE_API_URL ×2, PUBLIC_API_URL, CSP connect-src ×2, sitemap rewrite).
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase → Connect → Session pooler URI (IPv4; Render has no IPv6 egress). Secret: set in dashboard.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Optional: Supabase "SSL certificate" PEM → verified TLS. Without it TLS is encrypted but unverified.
      - key: DATABASE_CA_CERT
        sync: false
      # Supabase poolers cap client connections per project; one API instance stays well below it.
      - key: DATABASE_POOL_MAX
        value: "5"
      # Public site + admin custom domain only. Never list *.onrender.com defaults: released service names
      # are re-claimable by any Render customer.
      - key: CORS_ORIGINS
        value: https://trngnneee.io.vn,https://admin.trngnneee.io.vn
      # Render sits behind Cloudflare: req.ip is a rotating Cloudflare egress IP. Cloudflare overwrites this
      # header on every request, so rate limits key on the real client.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: PUBLIC_SITE_URL
        value: https://trngnneee.io.vn
      - key: PUBLIC_API_URL
        value: https://portfolio-api-5hvt.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      - key: CLOUDINARY_FOLDER
        value: portfolio
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional: email notifications for contact messages.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Portfolio <noreply@trngnneee.io.vn>

  # --------------------------------------------------------- Public site
  - type: web
    name: portfolio-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w shared && npm run build -w frontend
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    domains:
      - trngnneee.io.vn
    envVars:
      - key: VITE_API_URL
        value: https://portfolio-api-5hvt.onrender.com
      - key: VITE_SITE_URL
        value: https://trngnneee.io.vn
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
    routes:
      # Order matters: the sitemap is generated by the API, everything else is the SPA.
      - type: rewrite
        source: /sitemap.xml
        destination: https://portfolio-api-5hvt.onrender.com/sitemap.xml
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      - path: /*
        name: Content-Security-Policy
        # style 'unsafe-inline': motion animations + mermaid SVGs set inline styles.
        # JSON-LD <script type="application/ld+json"> is a data block, not executed, so script-src stays 'self'.
        value: >-
          default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com https://cdn.jsdelivr.net;
          connect-src 'self' https://portfolio-api-5hvt.onrender.com; frame-ancestors 'none'; base-uri 'self';
          form-action 'self'; object-src 'none'; upgrade-insecure-requests

  # --------------------------------------------------------------- Admin
  - type: web
    name: portfolio-admin
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w shared && npm run build -w admin
    staticPublishPath: admin/dist
    pullRequestPreviewsEnabled: false
    # Custom domain admin.trngnneee.io.vn is attached in the Render dashboard (not declared here, so a
    # Blueprint sync never trips the free-tier custom-domain limit). Must stay listed in the API's CORS_ORIGINS.
    envVars:
      - key: VITE_API_URL
        value: https://portfolio-api-5hvt.onrender.com
      - key: VITE_PUBLIC_SITE_URL
        value: https://trngnneee.io.vn
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      - path: /*
        name: Content-Security-Policy
        # style 'unsafe-inline': Astryx/StyleX theme injects runtime styles. blob: for local file previews.
        value: >-
          default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://cdn.jsdelivr.net;
          connect-src 'self' https://portfolio-api-5hvt.onrender.com; frame-ancestors 'none'; base-uri 'none';
          form-action 'self'; object-src 'none'; upgrade-insecure-requests
